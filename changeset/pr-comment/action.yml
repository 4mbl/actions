name: Changeset PR Comment
description: Add a comment to a PR if a changeset is not present

inputs:
  message:
    description: The message to comment on the PR
    default: 'Hey! Remember to add a changeset with `pnpm changeset add` to describe your changes for versioning.'

runs:
  using: composite
  steps:
    - name: Check required tools
      shell: bash
      run: |
        command -v gh >/dev/null 2>&1 || {
          echo "GitHub CLI (gh) is required"
          exit 1
        }

        command -v jq >/dev/null 2>&1 || {
          echo "jq is required"
          exit 1
        }

    - name: Check changesets and comments
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
        HAS_CHANGESET=$(gh api --paginate \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | \
          jq --slurp --raw-output 'any(.[][]; .status != "removed" and (.filename | test("^\\.changeset/[^/]+\\.md$") and . != ".changeset/README.md"))')

        COMMENTS=$(gh api --paginate \
          "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" | \
          jq --slurp --raw-output --arg message "$MESSAGE" \
            '.[][] | select(.user.login == "github-actions[bot]" and .body == $message) | .id')

        if [ "$HAS_CHANGESET" = "true" ]; then
          for COMMENT_ID in $COMMENTS; do
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"
          done
        elif [ -z "$COMMENTS" ]; then
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
        fi
