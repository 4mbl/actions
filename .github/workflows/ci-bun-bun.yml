on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        default: 10
        description: Timeout in minutes for each job.
      disable-steps:
        required: false
        type: string
        default: '[""]'
      extra-steps:
        required: false
        type: string
        default: '[""]'
        description: |
          Additional steps to run. These may be enabled by default in future major versions.
    secrets:
      ENV:
        description: JSON object containing arbitrary environment variables to inject into each job.
        required: false
      TURBO_TOKEN:
        description: Access token to a Turborepo compatible Remote Cache. You need to configure Turbo on your repo and call `turbo` on your `package.json` scripts for this to have any effect. You also need to pass TURBO_TEAM secret to this workflow.
        required: false
      TURBO_TEAM:
        description: Turborepo team name. You also need to pass TURBO_TOKEN secret to this workflow.
        required: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  ENV: ${{ secrets.ENV }}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Report results
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install

      - id: format
        name: Format
        if: ${{ !contains(fromJson(inputs.disable-steps), 'format') }}
        continue-on-error: true
        run: bun run --if-present format:check

      - id: lint
        name: Lint
        if: ${{ !contains(fromJson(inputs.disable-steps), 'lint') }}
        continue-on-error: true
        run: bun run --if-present lint

      - id: typecheck
        name: Typecheck
        if: ${{ !contains(fromJson(inputs.disable-steps), 'typecheck') }}
        continue-on-error: true
        run: bun run --if-present typecheck

      - id: test
        name: Test
        if: ${{ !contains(fromJson(inputs.disable-steps), 'test') }}
        continue-on-error: true
        run: bun run --if-present test

      - id: build
        name: Build
        if: ${{ !contains(fromJson(inputs.disable-steps), 'build') }}
        continue-on-error: true
        run: bun run --if-present build

      - id: test_e2e
        name: Test (E2E)
        if: ${{ !contains(fromJson(inputs.disable-steps), 'test_e2e') && contains(fromJson(inputs.extra-steps), 'test_e2e') }}
        continue-on-error: true
        run: bun run --if-present test:e2e

      - name: Report results
        if: ${{ always() }}
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_E2E_OUTCOME: ${{ steps.test_e2e.outcome }}
        run: |
          failed=false

          for outcome in \
            "$FORMAT_OUTCOME" \
            "$LINT_OUTCOME" \
            "$TYPECHECK_OUTCOME" \
            "$TEST_OUTCOME" \
            "$BUILD_OUTCOME" \
            "$TEST_E2E_OUTCOME"; do
            if [ "$outcome" = "failure" ] || [ "$outcome" = "cancelled" ]; then
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            echo "One or more checks failed or were cancelled"
            exit 1
          fi

          echo "All enabled checks succeeded"
