on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        required: false
        type: number
        default: 10
        description: Timeout in minutes for each step.
      disable-steps:
        required: false
        type: string
        default: '[""]'
    secrets:
      ENV:
        description: JSON object containing arbitrary environment variables to inject into each job.
        required: false
      TURBO_TOKEN:
        description: Access token to a Turborepo compatible Remote Cache. You need to configure Turbo on your repo and call `turbo` on your `package.json` scripts for this to have any effect. You also need to pass TURBO_TEAM secret to this workflow.
        required: false
      TURBO_TEAM:
        description: Turborepo team name. You also need to pass TURBO_TOKEN secret to this workflow.
        required: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  ENV: ${{ secrets.ENV }}

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          cache: true
          run_install: true

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ !contains(fromJson(inputs.disable-steps), 'typecheck') }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          cache: true
          run_install: true

      - run: pnpm run --if-present typecheck

  format:
    name: Format
    needs: setup
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ !contains(fromJson(inputs.disable-steps), 'format') }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          cache: true
          run_install: true

      - run: pnpm run --if-present format:check

  lint:
    name: Lint
    needs: setup
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ !contains(fromJson(inputs.disable-steps), 'lint') }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          cache: true
          run_install: true

      - run: pnpm run --if-present lint

  build:
    name: Build
    needs: setup
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ !contains(fromJson(inputs.disable-steps), 'build') }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          cache: true
          run_install: true

      - run: pnpm run --if-present build

  test:
    name: Test
    needs: setup
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: ${{ !contains(fromJson(inputs.disable-steps), 'test') }}
    steps:
      - name: Inject environment variables
        if: ${{ env.ENV != '' }}
        run: |
          echo "$ENV" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
        with:
          cache: true
          run_install: true

      - run: pnpm run --if-present test

  results:
    name: Report results
    runs-on: ${{ inputs.os }}
    needs:
      - setup
      - typecheck
      - format
      - lint
      - build
      - test
    if: always()
    steps:
      - name: Evaluate results
        run: |
          results=(
            "${{ needs.setup.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.format.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.build.result }}"
            "${{ needs.test.result }}"
          )

          for result in "${results[@]}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CI failed due to job result: $result"
              exit 1
            fi
          done

          echo "All required jobs succeeded or were skipped"
