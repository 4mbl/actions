on:
  workflow_call:
    inputs:
      os:
        required: false
        type: string
        default: ubuntu-slim
      timeout-minutes:
        required: false
        type: number
        default: 10
        description: Timeout in minutes for each job.

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.actor != 'dependabot[bot]'

    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    permissions:
      pull-requests: write

    steps:
      - name: Warn about unmaintained version
        run: echo '::warning::This v1 workflow is no longer maintained. See https://github.com/4mbl/actions for maintained versions.'

      - name: Post comment
        uses: 4mbl/actions/changeset/pr-comment@2081dceaa44e6779749a404249afd9d0b28ea9c3 # v1
